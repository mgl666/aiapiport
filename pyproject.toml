[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiapiport"
version = "0.1.0"
description = "Lightweight LLM API gateway — aggregates multiple providers into one OpenAI-compatible endpoint"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "openai", "api", "gateway", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Go",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.scripts]
aiapiport = "aiapiport.__main__:main"

[tool.setuptools.packages.find]
include = ["aiapiport*"]

[tool.setuptools.package-data]
aiapiport = ["aiapiport-bin", "aiapiport-bin.exe", "aiapiport-bin-linux-amd64", "aiapiport-bin-linux-arm64"]